<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Stock Opname</title>
    <!-- Memuat library kamera scanner dari internet -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; margin: 0; }
        h2 { color: #333; font-size: 22px; }
        #reader { width: 100%; max-width: 400px; margin: auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #result { margin-top: 20px; font-size: 16px; font-weight: bold; color: #333; padding: 10px; }
        .success { color: #2e7d32; background: #e8f5e9; border-radius: 5px; padding: 10px; display: inline-block; }
        .error { color: #c62828; background: #ffebee; border-radius: 5px; padding: 10px; display: inline-block; }
    </style>
</head>
<body>

    <h2>Stock Opname Barcode</h2>
    <p>Arahkan kamera ke barcode produk</p>

    <!-- Kotak tempat kamera akan muncul -->
    <div id="reader"></div>
    
    <div id="result">Menunggu scan...</div>

    <script>
        // ==========================================
        // TEMPEL URL WEB APP ANDA DI ANTARA TANDA KUTIP DI BAWAH INI
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwQ_rupos6K42AJqkm9PJl6ANVPpyqeimN0gdCkHxVTCuGDW8m4Qril9CIVZsvG1PhFOg/exec";

        function onScanSuccess(decodedText, decodedResult) {
            // Hentikan sementara scanner agar tidak scan dobel secara beruntun
            html5QrCode.stop().then(() => {
                document.getElementById('result').innerText = "Mengirim: " + decodedText;
                
                // Kirim data ke Google Apps Script
                fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ barcode: decodedText })
                })
                .then(() => {
                    document.getElementById('result').innerHTML = `<div class="success">Berhasil disimpan: ${decodedText}</div>`;
                    // Nyalakan kembali scanner setelah 2 detik untuk scan berikutnya
                    setTimeout(startScanner, 2000);
                })
                .catch(error => {
                    document.getElementById('result').innerHTML = `<div class="error">Gagal mengirim data</div>`;
                    setTimeout(startScanner, 2000);
                });
            }).catch(err => {
                console.error("Gagal menghentikan scanner.", err);
            });
        }

        const html5QrCode = new Html5Qrcode("reader");
        
        function startScanner() {
            document.getElementById('result').innerText = "Menunggu scan...";
            html5QrCode.start(
                { facingMode: "environment" }, // Menggunakan kamera belakang HP
                { fps: 10, qrbox: { width: 250, height: 150 } },
                onScanSuccess
            ).catch(err => {
                document.getElementById('result').innerHTML = `<div class="error">Gagal membuka kamera. Pastikan izin kamera aktif.</div>`;
            });
        }

        // Jalankan scanner saat halaman pertama kali dibuka
        startScanner();
    </script>
</body>
</html>
