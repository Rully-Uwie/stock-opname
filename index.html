<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 15px; background: #f4f4f9; margin: 0; }
        .card { background: white; padding: 15px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #1b5e20; }
        #reader { width: 100%; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .hidden { display: none; }
        #result-info { font-weight: bold; color: #d32f2f; margin: 10px 0; }
        .success { color: #2e7d32; background: #e8f5e9; padding: 8px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Stock Opname</h2>
    
    <div id="setup-section">
        <input type="text" id="petugas" placeholder="Nama Petugas" required>
        <input type="text" id="area" placeholder="Area / Rak Penyimpanan" required>
        <button onclick="mulaiOpname()">Mulai Scan</button>
    </div>

    <div id="scanner-section" class="hidden">
        <p style="font-size: 14px; color: #666; margin: 0;">Petugas: <b id="lbl-petugas"></b> | Area: <b id="lbl-area"></b></p>
        
        <div id="reader"></div>
        
        <div id="result-info">Menunggu scan...</div>

        <div id="form-submit" class="hidden">
            <label style="font-size: 14px; float: left; font-weight: bold;">Barcode Terdeteksi:</label>
            <input type="text" id="barcode-val" readonly style="background: #e0e0e0;">
            
            <label style="font-size: 14px; float: left; font-weight: bold;">Jumlah (Qty):</label>
            <input type="number" id="qty-val" value="1" min="1">
            
            <button onclick="kirimData()">Submit Data</button>
        </div>
    </div>
    
    <div id="status-pesan"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwQ_rupos6K42AJqkm9PJl6ANVPpyqeimN0gdCkHxVTCuGDW8m4Qril9CIVZsvG1PhFOg/exec"; // Jangan lupa ganti dengan URL Web App Anda!
    
    let html5QrCode;
    let globalPetugas = "";
    let globalArea = "";

    function mulaiOpname() {
        globalPetugas = document.getElementById('petugas').value.trim();
        globalArea = document.getElementById('area').value.trim();

        if(!globalPetugas || !globalArea) {
            alert("Mohon isi Nama Petugas dan Area terlebih dahulu!");
            return;
        }

        document.getElementById('setup-section').classList.add('hidden');
        document.getElementById('scanner-section').classList.remove('hidden');
        
        document.getElementById('lbl-petugas').innerText = globalPetugas;
        document.getElementById('lbl-area').innerText = globalArea;

        inisialisasiKamera();
    }

    function inisialisasiKamera() {
        html5QrCode = new Html5Qrcode("reader");
        
        // Konfigurasi tambahan agar optimal membaca barcode garis retail (1D)
        const config = { 
            fps: 15, 
            qrbox: { width: 280, height: 120 },
            // Mengaktifkan berbagai format barcode ritel umum
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.QR_CODE
            ]
        };

        // Meminta kamera belakang dengan prioritas penyesuaian fokus
        html5QrCode.start(
            { facingMode: "environment" }, 
            config,
            onScanSuccess
        ).catch(err => {
            document.getElementById('result-info').innerText = "Gagal membuka kamera. Pastikan izin aktif.";
        });
    }

    function onScanSuccess(decodedText, decodedResult) {
        html5QrCode.stop().then(() => {
            document.getElementById('reader').style.display = 'none';
            document.getElementById('result-info').innerText = "Barcode Berhasil Dipindai!";
            
            document.getElementById('barcode-val').value = decodedText;
            document.getElementById('qty-val').value = "1";
            document.getElementById('form-submit').classList.remove('hidden');
        }).catch(err => {
            console.error("Gagal menghentikan kamera", err);
        });
    }

    function kirimData() {
        let barcode = document.getElementById('barcode-val').value;
        let qty = document.getElementById('qty-val').value;

        document.getElementById('status-pesan').innerHTML = "Mengirim data...";
        document.getElementById('form-submit').classList.add('hidden');

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                petugas: globalPetugas,
                area: globalArea,
                barcode: barcode,
                qty: qty
            })
        })
        .then(() => {
            document.getElementById('status-pesan').innerHTML = `<div class="success">Data tersimpan: ${barcode} (Qty: ${qty})</div>`;
            
            setTimeout(() => {
                document.getElementById('status-pesan').innerHTML = "";
                document.getElementById('reader').style.display = 'block';
                document.getElementById('result-info').innerText = "Menunggu scan...";
                inisialisasiKamera();
            }, 1500);
        })
        .catch(error => {
            alert("Gagal mengirim data!");
            document.getElementById('form-submit').classList.remove('hidden');
        });
    }
</script>

</body>
</html>
